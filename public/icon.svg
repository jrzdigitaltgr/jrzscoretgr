<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0e2347"/>
      <stop offset="60%" stop-color="#050d1e"/>
      <stop offset="100%" stop-color="#02050e"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#162c52" stroke-width="4"/>

  <!-- Glowing Emblem Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="12 12" />

  <!-- Shield Base -->
  <path d="M256 80 L370 140 C370 270 256 360 256 360 C256 360 142 270 142 140 Z" 
        fill="url(#shieldGrad)" 
        stroke="#22d3ee" 
        stroke-width="5" 
        filter="url(#glow)"/>

  <!-- Inner Shield Border -->
  <path d="M256 102 L350 152 C350 254 256 332 256 332 C256 332 162 254 162 152 Z" 
        fill="#040a18" 
        stroke="url(#goldGrad)" 
        stroke-width="3"/>

  <!-- Crossed Keris / Swords Silhouette -->
  <path d="M220 160 L292 270 M292 160 L220 270" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="215" r="32" fill="#061838" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="256" cy="215" r="12" fill="#f59e0b"/>

  <!-- JRZ Brand Text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">JRZ SCORE</text>
  <text x="256" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#22d3ee" letter-spacing="8">TGR</text>
</svg>
